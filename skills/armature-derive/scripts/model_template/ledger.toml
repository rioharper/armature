# The bus's two bands, each searched as an axis by every drive margin: an
# electrolytic bank is ±20 %, and the source's set point ±2 %. The least
# capacitance on the highest source is where regeneration lifts the bus
# furthest.
[drive.c_bus]
value = 0.010
unit = "F"
as_written = "10 mF"
band = [0.008, 0.012]
status = "confirmed"
source = { kind = "datasheet", ref = "example-bus-bank", retrieved = 2026-10-21 }
note = "the bus capacitance, the bank's rating"

[drive.v_bus]
value = 48.0

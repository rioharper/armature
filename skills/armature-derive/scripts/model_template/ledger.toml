# ledger.toml — the 2R arm's input numbers, each written once (ADR 0010).
#
# The template's own, for its self-run. A project keeps one ledger at its
# root, and spec §9 and derive's Step 0 never copy this one into it.
# `params.py` loads it, walking up from its own folder, and `run_all.py`
# runs `python -m armature.ledger check` on it as Milestone 0.
#
# Values are SI, with temperatures in °C. A datasheet's figure keeps the
# quantity as printed in `as_written`, and its basis (rms or peak, line or
# phase) in `basis`. The datasheet refs name the datasheet index's rows, and
# here they name example parts: replace them with your machine's.

# --- mechanism: exactly what mechanism(p) reads ---

[mechanism.l1]
value = 0.30
unit = "m"
source = { kind = "chosen", ref = "spec §5" }
note = "link 1's length, shoulder to elbow"

[mechanism.l2]
value = 0.25
unit = "m"
source = { kind = "chosen", ref = "spec §5" }
note = "link 2's length, elbow to the tool"

[mechanism.lc1]
value = 0.15
unit = "m"
source = { kind = "chosen", ref = "spec §5" }
note = "link 1's COM from the shoulder: mid-link, until CAD measures the part"

[mechanism.lc2]
value = 0.125
unit = "m"
source = { kind = "chosen", ref = "spec §5" }
note = "link 2's COM from the elbow: mid-link, until CAD measures the part"

[mechanism.m1]
value = 1.20
unit = "kg"
source = { kind = "chosen", ref = "spec §9, the mass budget" }
note = "link 1's mass"

[mechanism.m2]
value = 0.80
unit = "kg"
band = [0.72, 0.88]
status = "confirmed"
source = { kind = "estimate", ref = "the forearm's mass budget, held to ±10 % until CAD measures the part" }
note = "link 2's mass, bare: the payload is a tip load"

[mechanism.I1]
value = [[0.00024, 0.0, 0.0], [0.0, 0.012, 0.0], [0.0, 0.0, 0.012]]
unit = "kg*m^2"
point = "link 1's COM"
axes = "base, at home"
source = { kind = "chosen", ref = "spec §9, the mass budget" }
note = "link 1's inertia, a slender rod's on every axis: along the link, then across it"

[mechanism.I2]
value = [[0.00016, 0.0, 0.0], [0.0, 0.006, 0.0], [0.0, 0.0, 0.006]]
unit = "kg*m^2"
point = "link 2's COM"
axes = "base, at home"
source = { kind = "chosen", ref = "spec §9, the mass budget" }
note = "link 2's inertia, a slender rod's on every axis: along the link, then across it"

[mechanism.g]
value = 9.81
unit = "m/s^2"
as_written = "9.81 m/s^2"
source = { kind = "standard", ref = "standard gravity, to three figures" }
note = "gravitational acceleration"

# Each motor's continuous torque, derated: the limit every holding margin is
# slack against, and what the truth model's settle clamps a command to. Both
# motors are direct drive, so a motor's torque is its joint's.
[mechanism.tau1]
value = 15.0
unit = "N*m"
source = { kind = "chosen", ref = "spec §9, the derating" }
note = "the shoulder motor's derated continuous torque"

[mechanism.tau2]
value = 6.0
unit = "N*m"
source = { kind = "chosen", ref = "spec §9, the derating" }
note = "the elbow motor's derated continuous torque"


band = [47.0, 49.0]
status = "confirmed"
source = { kind = "datasheet", ref = "example-psu", retrieved = 2026-10-21 }
note = "the source's set point, a PSU behind a diode"

[drive.hotel]
value = 5.0
unit = "W"
source = { kind = "chosen", ref = "spec §9, the power budget" }
note = "the electronics' constant draw, as the power budget allocates it"


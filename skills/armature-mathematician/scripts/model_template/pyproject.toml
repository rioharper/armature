[project]
name = "robot-model"
version = "0.1.0"
description = "Kinematic and dynamic model — armature-mathematician"
requires-python = ">=3.11"
dependencies = ["sympy>=1.12", "numpy>=1.26", "scipy>=1.11", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.100"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "m1: kinematics milestone",
    "m2: dynamics milestone",
    "m3: verification and results milestone",
]

[project]
name = "armature-engine"
version = "0.1.0"
description = "Armature's mechanism description, compiled through MuJoCo and queried on named states."
requires-python = ">=3.12"
dependencies = [
    "mujoco~=3.15.0",
    "numpy>=2.0",
    "ruckig~=0.19.4",
    "scipy>=1.14",
    "sympy>=1.13",
]

[dependency-groups]
dev = ["pillow>=12", "pytest>=8"]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "armature"

[tool.pytest.ini_options]
testpaths = ["tests"]

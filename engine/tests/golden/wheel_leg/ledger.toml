# --- req: the requirements' thresholds, keyed by REQ id ---
# The hips' working range: a box inside their joint ranges, over which the
# loop closes everywhere.

[req.REQ-001]
value = -1.0
unit = "rad"
source = { kind = "chosen", ref = "REQ-001" }
note = "the workspace's least hip A angle"

[req.REQ-002]
value = 1.0
unit = "rad"
source = { kind = "chosen", ref = "REQ-002" }
note = "the workspace's greatest hip A angle"

[req.REQ-003]
value = -0.5
unit = "rad"
source = { kind = "chosen", ref = "REQ-003" }
note = "the workspace's least hip E angle"

[req.REQ-004]
value = 2.0
unit = "rad"
source = { kind = "chosen", ref = "REQ-004" }
note = "the workspace's greatest hip E angle"


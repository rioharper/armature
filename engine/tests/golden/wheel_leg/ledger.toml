# ledger.toml — the wheel leg's input numbers, each written once (ADR 0010):
# a five-bar leg on a wheel. `params.py` loads it, walking up from its own
# folder, and `run_all.py` runs `python -m armature.ledger check` on it as
# Milestone 0. Values are SI.

# --- mechanism: exactly what mechanism(p) reads ---
# The leg's five points at home, in the torso's frame: A and E the hips, B
# and D the knees, C the pin.

[mechanism.Ax]
value = -0.05
unit = "m"
source = { kind = "chosen", ref = "spec" }
note = "the hip A, x"

[mechanism.Ay]
value = 0.0
unit = "m"
source = { kind = "chosen", ref = "spec" }
note = "the hip A, y"

[mechanism.Bx]
value = -0.10
unit = "m"
source = { kind = "chosen", ref = "spec" }
note = "the knee B, x"

[mechanism.By]
value = -0.10
unit = "m"
source = { kind = "chosen", ref = "spec" }
note = "the knee B, y"

[mechanism.Cx]
value = 0.0
unit = "m"
source = { kind = "chosen", ref = "spec" }
note = "the pin C, x"

[mechanism.Cy]
value = -0.25
unit = "m"
source = { kind = "chosen", ref = "spec" }
note = "the pin C, y"

[mechanism.Ex]
value = 0.05
unit = "m"
source = { kind = "chosen", ref = "spec" }
note = "the hip E, x"

[mechanism.Ey]
value = 0.0
unit = "m"
source = { kind = "chosen", ref = "spec" }
note = "the hip E, y"

[mechanism.Dx]
value = 0.11
unit = "m"
source = { kind = "chosen", ref = "spec" }
note = "the knee D, x"

[mechanism.Dy]
value = -0.09
unit = "m"
source = { kind = "chosen", ref = "spec" }
note = "the knee D, y"

# The four links: l1 A to B, l2 B to C, l3 E to D, l4 D to C.


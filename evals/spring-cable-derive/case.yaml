name: spring-cable-derive
description: >-
  Derive, on the mass on a cable. The brief's spec assumption A3 says the
  cable is inextensible, which leaves the bob no mode; the decision is the
  first mode. Caught when the report gives f = sqrt(k/m) / 2 pi inside the
  window and decides on the elastic cable.

schema_version: "1.1"
name: turret-derive
description: >-
  The hold-out (#132): derive, on the geared turret. Nobody tunes against
  it, and it never gates. The brief only implies that the turret's weight
  bears straight down the pan axis, which leaves the bearing's moment out;
  the decision is whether the pan bearing carries the slew. Caught when the
  report gives the slew's peak moment m d √((g + h ω₁²)² + (h a)²) inside
  the window and checks it against the moment rating.
tags: [derive, turret, holdout]
context:
  scaffold_script: scaffold.sh

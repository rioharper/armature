schema_version: "1.1"
name: cable-platform-braking-unstated
description: >-
  An unstated-only trap (#150), a signed load checked at one sign: the
  platform traverses along x through the edge midpoint and brakes at
  2.5 m/s², and the brief names no direction of travel. Braking one way
  slackens two cables below the winch's 2 N floor; the other way leaves them
  above it. A passing run_all.py exposes neither, so only checking both
  signs of the load finds the worse.
tags: [derive, cable_platform, unstated]
context:
  scaffold_script: scaffold.sh
